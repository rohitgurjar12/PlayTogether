<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Together</title>
<style>
:root{--bg:#fafaf8;--fg:#1a1a1a;--mut:#8a8a85;--line:#e4e4df}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececea;--mut:#8d8d88;--line:#2a2a28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:48px 24px;display:flex;flex-direction:column;gap:22px}
h1{font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:0}
.row{display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;padding:10px 0;outline:none}
input[type=text]:focus{border-color:var(--fg)}
button{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
button:hover{border-color:var(--fg)}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mut{color:var(--mut);font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:8px}
.dot.on{background:#3bb273}
.tabs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;width:fit-content}
.tabs button{border:0;padding:6px 20px}
.tabs button.on{background:var(--fg);color:var(--bg)}
#stage{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--line);position:relative}
#stage>div,#stage iframe{position:absolute;inset:0;width:100%;height:100%}
#ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;padding:24px;text-align:center}
#ytw{z-index:1}
#res{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
#res li{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column}
#res li span{color:var(--mut);font-size:13px}
#res li:hover b{text-decoration:underline}
#np{display:flex;flex-direction:column;gap:14px}
#np .top{display:flex;gap:14px;align-items:center}
#cover{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--line)}
#ttl{font-weight:500}
input[type=range]{width:100%;accent-color:var(--fg)}
.hide{display:none!important}
.col{display:flex;flex-direction:column;gap:18px}
</style></head><body><main>
<h1>Play Together</h1>

<section id="join"><p class="mut">Pick a room name and share the link with your friend.</p>
<div class="row"><input type="text" id="room" placeholder="room-name" maxlength="24" autocapitalize="off"><button class="p" id="go">Join</button></div></section>

<section id="app" class="col hide">
  <div class="mut"><span class="dot" id="dot"></span><span id="status">Waiting for friend…</span></div>
  <div class="tabs"><button id="tabAu" class="on">Audio</button><button id="tabYt">Video</button></div>
  <p class="mut" id="note" style="margin:0"></p>

  <div id="audioView" class="col">
    <div class="row"><input type="text" id="q" placeholder="Search songs"><button class="p" id="sb">Search</button></div>
    <ul id="res"></ul>
    <div id="np" class="hide">
      <div class="top"><img id="cover" class="hide" alt=""><div><div id="ttl"></div><div class="mut" id="art"></div></div></div>
      <input type="range" id="bar" min="0" max="0" step="1" value="0">
      <div class="row" style="justify-content:space-between"><span class="mut" id="t">0:00 / 0:00</span><button id="apb">Pause</button></div>
    </div>
    <p class="mut" style="margin:0">Free full-length songs via Audius and Jamendo. Artists are credited above.</p>
  </div>

  <div id="videoView" class="col hide">
    <div class="row"><input type="text" id="url" placeholder="Paste a YouTube link"><button class="p" id="load">Play</button></div>
    <div id="stage"><div id="ph">Nothing playing</div><div id="ytw"></div></div>
  </div>

  <div class="row" style="justify-content:center"><button id="copy">Copy invite link</button></div>
</section>
<audio id="au" preload="auto"></audio>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=i=>document.getElementById(i),me=Math.random().toString(36).slice(2),RM=()=>location.hash.slice(1);
const say=t=>{$('note').textContent=t;$('ph').textContent=t||'Nothing playing';if(t)$('ph').classList.remove('hide')};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
let mode='au',type=null,vid=null,meta=null,playing=false,mute=0,lastV=0,okNet=true;
let player=null,ytReady=false,pending=null,expect=0,expectTs=0;
const au=$('au'),lock=ms=>{mute=Date.now()+(ms||1800)},muted=()=>Date.now()<mute;
const post=(pl,pos)=>fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:RM(),id:me,type,vid,meta,playing:pl,pos})}).catch(()=>{});

function setMode(m){
  mode=m;
  $('tabAu').classList.toggle('on',m==='au');$('tabYt').classList.toggle('on',m==='yt');
  $('audioView').classList.toggle('hide',m!=='au');$('videoView').classList.toggle('hide',m!=='yt');
  lock();
  if(m==='au'){if(player&&player.pauseVideo){try{player.pauseVideo()}catch(e){}}}else au.pause();
}
$('tabAu').onclick=()=>setMode('au');$('tabYt').onclick=()=>setMode('yt');

/* ---------- Audio ---------- */
function showNow(){
  $('np').classList.remove('hide');$('ttl').textContent=(meta&&meta.title)||'';$('art').textContent=(meta&&meta.artist)||'';
  const i=$('cover');if(meta&&/^https:\/\//.test(meta.art||'')){i.src=meta.art;i.classList.remove('hide')}else i.classList.add('hide');
}
async function playAudio(id,m,pos,play){
  type='au';vid=id;meta=m||{};showNow();say('Loading…');lock(6000);
  try{
    const r=await fetch('/api/stream?id='+encodeURIComponent(id)),d=await r.json();if(!d.url)throw new Error();
    au.src=d.url;au.onloadedmetadata=()=>{if(pos>0)au.currentTime=pos};
    say('');if(play)await au.play();
  }catch(e){say(e&&e.name==='NotAllowedError'?'Tap Play to start.':"Couldn't load this track. Try another one.")}
}
const lbl=()=>{$('apb').textContent=au.paused?'Play':'Pause'};
au.addEventListener('play',lbl);au.addEventListener('pause',lbl);
au.onplay=()=>{if(muted())return;playing=true;post(true,au.currentTime)};
au.onpause=()=>{if(muted()||au.ended)return;playing=false;post(false,au.currentTime)};
au.onseeked=()=>{if(muted())return;post(!au.paused,au.currentTime)};
au.onended=()=>{playing=false;if(!muted())post(false,0)};
au.ontimeupdate=()=>{if(isFinite(au.duration))$('bar').max=Math.floor(au.duration);$('bar').value=au.currentTime;$('t').textContent=fmt(au.currentTime)+' / '+fmt(au.duration)};
$('bar').oninput=()=>{if(type==='au')au.currentTime=+$('bar').value};
$('apb').onclick=()=>{if(type!=='au')return;au.paused?au.play():au.pause()};
async function search(){
  const q=$('q').value.trim();if(!q)return;say('Searching…');
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(q)),d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    const ul=$('res');ul.innerHTML='';
    if(!d.tracks.length){say('No results.');return}
    say('');
    d.tracks.forEach(t=>{
      const li=document.createElement('li'),a=document.createElement('b'),b=document.createElement('span');
      a.textContent=t.title;b.textContent=(t.artist||'')+(t.from?' · '+t.from:'');li.append(a,b);
      li.onclick=()=>{ul.innerHTML='';playing=true;playAudio(t.id,{title:t.title,artist:t.artist,art:t.art},0,true);post(true,0)};
      ul.append(li);
    });
  }catch(e){say('Search failed: '+e.message)}
}
$('sb').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};

/* ---------- Video (YouTube) ---------- */
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pending){const p=pending;pending=null;apply(p)}};
const ytId=s=>{const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(s.trim())?s.trim():null};
function makePlayer(id,pos,play){
  if(typeof YT==='undefined'||!YT.Player){pending={type:'yt',vid:id,pos:pos,playing:play};ytReady=false;say('Loading YouTube player… if this stays, disable your ad blocker.');return}
  $('ph').classList.add('hide');say('');
  if(player){try{player.destroy()}catch(e){}player=null}
  $('ytw').innerHTML='<div id="yt"></div>';
  player=new YT.Player('yt',{videoId:id,playerVars:{start:Math.floor(pos),autoplay:play?1:0,playsinline:1,rel:0},
    events:{onStateChange:e=>{if(muted())return;if(e.data===1||e.data===2){playing=e.data===1;post(playing,player.getCurrentTime())}}}});
}
$('load').onclick=()=>{
  const id=ytId($('url').value);if(!id){say("That doesn't look like a YouTube link.");return}
  type='yt';meta=null;vid=id;playing=true;lock();say('Loading…');makePlayer(id,0,true);setTimeout(()=>post(true,0),800);
};
setInterval(()=>{ // detect manual seeks in the YouTube player
  if(type!=='yt'||!player||!player.getCurrentTime||muted())return;
  const t=player.getCurrentTime(),exp=expect+(playing?(Date.now()-expectTs)/1000:0);
  if(Math.abs(t-exp)>2.5)post(playing,t);
  expect=t;expectTs=Date.now();
},1000);

/* ---------- Sync ---------- */
function apply(s){
  const m=s.type==='au'?'au':'yt';
  if(m!==mode)setMode(m);
  playing=s.playing;
  if(m==='au'){
    lock(s.vid!==vid||type!=='au'?6000:1800);
    if(s.vid!==vid||type!=='au'){playAudio(s.vid,s.meta,s.pos,s.playing);return}
    if(Math.abs(au.currentTime-s.pos)>1)au.currentTime=s.pos;
    s.playing?au.play().catch(()=>say('Tap Play to start.')):au.pause();
    return;
  }
  if(!ytReady){pending=s;return}
  lock();type='yt';meta=null;expect=s.pos;expectTs=Date.now();
  if(s.vid!==vid||!player||!player.seekTo){vid=s.vid;makePlayer(s.vid,s.pos,s.playing);return}
  player.seekTo(s.pos,true);s.playing?player.playVideo():player.pauseVideo();
}
async function poll(n){
  try{
    const r=await fetch('/api/room?room='+n+'&id='+me,{cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    if(!okNet){okNet=true;if($('note').textContent.startsWith('Sync'))say('')}
    $('dot').className='dot'+(d.peers>1?' on':'');$('status').textContent=d.peers>1?'Friend connected':'Waiting for friend…';
    const s=d.state;if(s&&s.v!==lastV){lastV=s.v;if(s.from!==me)apply(s)}
  }catch(e){okNet=false;$('status').textContent='Not connected';say('Sync problem: '+e.message)}
  setTimeout(()=>poll(n),1000);
}
function enter(n){
  n=n.replace(/[^\w-]/g,'').toLowerCase();if(!n)return;
  location.hash=n;$('join').classList.add('hide');$('app').classList.remove('hide');poll(n);
}
$('go').onclick=()=>enter($('room').value);
$('room').onkeydown=e=>{if(e.key==='Enter')enter(e.target.value)};
$('copy').onclick=()=>{navigator.clipboard.writeText(location.href);say('Link copied.')};
setTimeout(()=>{if(typeof YT==='undefined'&&mode==='yt')say("Couldn't load the YouTube player. Check your connection or ad blocker.")},5000);
if(RM())enter(RM());
</script></main></body></html>
